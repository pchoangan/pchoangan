<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập/Đăng ký</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
      }

      .container {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 300px;
      }

      .container h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        margin-bottom: 10px;
      }
      input[type="checkbox"] {
        margin-bottom: 10px;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }

      .error {
        color: red;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Đăng nhập/Đăng ký</h2>

      <div id="login-container">
        <h3>Đăng nhập</h3>
        <div id="login-form">
          <label for="username">Tên đăng nhập:</label>
          <input type="text" id="username" required />

          <label for="password">Mật khẩu:</label>
          <input type="password" id="password" required />

          <input type="checkbox" id="show-password" />
          <label for="show-password">Hiện mật khẩu</label>

          <button id="login-button" onclick="login()">Đăng nhập</button>
        </div>
        <p>
          Chưa có tài khoản? <a href="#" id="show-register">Đăng ký ngay</a>
        </p>
        <div id="login-error-message" class="error"></div>
      </div>

      <div id="register-container" style="display: none">
        <h3>Đăng ký</h3>
        <div id="register-form">
          <label for="reg-username">Tên đăng nhập:</label>
          <input type="text" id="reg-username" required />

          <label for="reg-password">Mật khẩu:</label>
          <input type="password" id="reg-password" required />

          <label for="reg-confirm-password">Xác nhận mật khẩu:</label>
          <input type="password" id="reg-confirm-password" required />

          <button id="reg-button" onclick="register()">Đăng ký</button>
        </div>
        <p>Đã có tài khoản? <a href="#" id="show-login">Đăng nhập</a></p>
        <div id="register-error-message" class="error"></div>
      </div>
    </div>
    <script>
      const scriptURL =
        "https://script.google.com/macros/s/AKfycbxTvH1tTHYnHXl_prIJczjytFZG0MPAclpHdzUxjEeiMABR_hBhrsAn1p-m5Ibwcr8/exec"; // Thay thế bằng URL triển khai của Apps Script

      function callAPI(action, email, password) {
        return fetch(scriptURL, {
          method: "POST",
          body: JSON.stringify({ action: action, email: email, password: password }),
        }).then((response) => response.json());
      }
      function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        callAPI("login", username, password).then((response) => {
          if (response.status === "success") {
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("username", username);
            window.location.href = "index.html";
          } else {
            document.getElementById("login-error-message").textContent =
              response.message;
          }
        });
      }
      function register() {
        const username = document.getElementById("reg-username").value;
        const password = document.getElementById("reg-password").value;
        const confirmPassword = document.getElementById(
          "reg-confirm-password"
        ).value;

        if (password !== confirmPassword) {
          document.getElementById("register-error-message").textContent =
            "Mật khẩu xác nhận không khớp.";
          return;
        }

        callAPI("register", username, password).then((response) => {
          if (response.status === "success") {
            alert(response.message);
            document.getElementById("register-container").style.display =
              "none";
            document.getElementById("login-container").style.display = "block";
          } else {
            document.getElementById("register-error-message").textContent =
              response.message;
          }
        });
      }
      // Chuyển đổi giữa form đăng nhập và đăng ký
      document.getElementById("show-register").addEventListener("click", () => {
        document.getElementById("login-container").style.display = "none";
        document.getElementById("register-container").style.display = "block";
      });

      document.getElementById("show-login").addEventListener("click", () => {
        document.getElementById("register-container").style.display = "none";
        document.getElementById("login-container").style.display = "block";
      });

      //Hiện mật khẩu
      document
        .getElementById("show-password")
        .addEventListener("change", (event) => {
          document.getElementById("password").type = event.target.checked
            ? "text"
            : "password";
        }); //event.target: Đây là cách chính xác để lấy phần tử DOM đã kích hoạt sự kiện
    </script>
  </body>
</html>
